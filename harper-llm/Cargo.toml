[package]
name = "harper-llm"
version = "3.0.0"
edition = "2024"
description = "PROTOTYPE: an optional grammar check with a local large language model, for Harper integrations."
license = "Apache-2.0"
repository = "https://github.com/automattic/harper"
publish = false

[dependencies]
harper-core = { path = "../harper-core", version = "3.0.0" }
anyhow = "1.0.102"
lru = "0.18.0"
regex = "1.12.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.52.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
